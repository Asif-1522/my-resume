<html>

<head>
    <title>My resume</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0f172a;

            padding: 20px;
        }

        .card{
            width: 350px;

            background: #111827;

            border-radius: 25px;

            overflow: hidden;

            text-align: center;

            box-shadow:
            0 0 15px #00f7ff,
            0 0 35px rgba(0,247,255,0.3);

            transition: 0.4s;
        }

        .card:hover{
            transform: translateY(-10px);
        }

        .top{
            height: 120px;

            background:
            linear-gradient(135deg,#00f7ff,#7c3aed);
        }

        .profile-img{
            width: 140px;
            height: 140px;

            border-radius: 50%;

            object-fit: cover;

            border: 5px solid #111827;

            margin-top: -70px;

            box-shadow: 0 0 20px #00f7ff;
        }

        .content{
            padding: 20px;
        }

        h1{
            color: white;

            margin-top: 15px;

            font-size: 30px;
        }

        .role{
            color: #00f7ff;

            margin-top: 8px;

            font-size: 17px;
        }

        .about{
            margin-top: 20px;

            color: #d1d5db;

            line-height: 1.7;

            font-size: 15px;

            background: rgba(255,255,255,0.05);

            padding: 15px;

            border-radius: 15px;
        }

        .buttons{
            margin-top: 25px;
        }

        .buttons a{
            display: inline-block;

            margin: 8px;

            padding: 12px 18px;

            text-decoration: none;

            border-radius: 30px;

            color: white;

            font-weight: bold;

            background:
            linear-gradient(135deg,#00f7ff,#7c3aed);

            transition: 0.3s;
        }

        .buttons a:hover{
            transform: scale(1.08);

            box-shadow: 0 0 20px #00f7ff;
        }

        .upload{
            margin-top: 25px;

            padding: 18px;

            border-radius: 18px;

            background: rgba(255,255,255,0.05);

            border: 1px dashed #00f7ff;
        }

        .upload h3{
            color: white;

            margin-bottom: 12px;
        }

        input[type="file"]{
            width: 100%;
            color: white;
        }

        /* Mobile Responsive */

        @media(max-width:480px){

            .card{
                width: 95%;
            }

            .buttons a{
                display: block;
                width: 100%;
                margin: 10px 0;
            }

            h1{
                font-size: 26px;
            }

            .about{
                font-size: 14px;
            }

        }

    </style>

</head>

<body>

    <div class="card">

        <div class="top"></div>

        <div class="content">

            <img src="Arif Alam.jpg" class="profile-img">

            <h1>MD ARIF ALAM</h1>

            <div class="role">
             SAFETY OFFICER (HSE)
            </div>

            <div class="about">
                Premier Marine Engineering Service LLC,Dubai | 2024-Present.
                NEBOSH/SQA (AUGUST 2025) & IOSH-e-Learning (MARCH 2026)
            </div>

            <div class="buttons">


                <a href="https://wa.me/+917301108163">
                    💬 WhatsApp
                </a>

                <a href="mailto:arifreja1234@gmai.com">
                    ✉ Email
                </a>

            </div>

            <div class="upload">

             <h3>📄 My Resume</h3>

            <a href="Arif_resume.pdf" target="_blank" class="resume-btn">
        📥     View Resume
              </a>

</div>

        </div>

    </div>

</body>

</html>
